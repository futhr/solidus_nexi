name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rspec:
    name: Solidus ${{ matrix.solidus }}, Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {solidus: v4.7, rails: "7.2", ruby: "3.2"}
          - {solidus: v4.7, rails: "7.2", ruby: "3.3"}
          - {solidus: v4.7, rails: "7.2", ruby: "3.4"}
          - {solidus: v4.7, rails: "7.2", ruby: "4.0"}
          - {solidus: v4.6, rails: "7.2", ruby: "3.2"}
          - {solidus: v4.6, rails: "7.2", ruby: "3.3"}
    env:
      SOLIDUS_BRANCH: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Verify dependency matrix
        run: |
          bundle exec ruby -rrails -e '
            expected = ENV.fetch("RAILS_VERSION")
            actual = Gem::Version.new(Rails::VERSION::STRING).segments.first(2).join(".")
            abort "Expected Rails #{expected}, resolved #{Rails::VERSION::STRING}" unless actual == expected
          '
      - name: Build test application
        run: bundle exec rake extension:test_app
      - name: Check eager loading
        run: (cd spec/dummy && bin/rails zeitwerk:check)
      - name: Run test suite
        run: bundle exec rake
      - name: Upload coverage to Codecov
        if: matrix.solidus == 'v4.7' && matrix.rails == '7.2' && matrix.ruby == '3.4'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ./coverage/lcov/lcov.info
          fail_ci_if_error: true

  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB: postgresql
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SOLIDUS_BRANCH: v4.7
      RAILS_VERSION: "7.2"
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build PostgreSQL test application
        run: bundle exec rake extension:test_app
      - name: Run test suite
        run: bundle exec rake

  mysql:
    name: MySQL 8.4
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: solidus_nexi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=mysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB: mysql
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: mysql
      SOLIDUS_BRANCH: v4.7
      RAILS_VERSION: "7.2"
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build MySQL test application
        run: bundle exec rake extension:test_app
      - name: Run test suite
        run: bundle exec rake

  lint:
    name: Ruby style
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  security:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Check dependencies against RubySec
        # Puma is pulled in only by solidus_dev_support and is absent from the
        # published gem's runtime dependencies. That helper currently pins < 7.
        run: >-
          bundle exec bundler-audit check --update
          --ignore CVE-2026-47736 CVE-2026-47737

  package:
    name: RubyGems package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - name: Build gem
        run: gem build solidus_nexi.gemspec
      - name: Inspect gem contents
        run: |
          ruby -rrubygems/package <<'RUBY'
          artifacts = Dir["solidus_nexi-*.gem"]
          abort "Expected one gem artifact, found #{artifacts.length}" unless artifacts.one?

          files = Gem::Package.new(artifacts.first).spec.files
          required = %w[
            lib/solidus_nexi.rb
            config/routes.rb
            db/migrate/20260816090000_create_solidus_nexi_payment_sources.rb
            db/migrate/20260816090100_create_solidus_nexi_operations.rb
            db/migrate/20260816090200_create_solidus_nexi_webhook_receipts.rb
            db/migrate/20260817090000_add_reconciliation_required_to_solidus_nexi_payment_sources.rb
            README.md
            CHANGELOG.md
            SECURITY.md
            docs/migration.md
            docs/operations.md
            docs/releasing.md
            docs/testing.md
          ]
          missing = required - files
          abort "Missing packaged files: #{missing.join(', ')}" unless missing.empty?

          forbidden = files.select do |path|
            path.start_with?("spec/") || path.include?("spree_dibs") || path.include?("gateway/dibs")
          end
          abort "Legacy or test files packaged: #{forbidden.join(', ')}" unless forbidden.empty?
          RUBY
