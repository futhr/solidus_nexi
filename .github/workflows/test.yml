name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run the additional compatibility profiles
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL 18.6, tests and quality
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUNDLE_BUILD__PG: --with-pg-config=/usr/bin/pg_config
      COVERAGE: "true"
      DB: postgresql
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SOLIDUS_VERSION: "4.8"
      RAILS_VERSION: "8.1"
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL 18.6 client
        run: bin/setup-postgresql-client
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build PostgreSQL test application
        run: bundle exec rake extension:test_app
      - name: Run test suite
        run: bundle exec rake

      - run: bin/zeitwerk-check
      - run: bundle exec rubocop
      - run: bundle exec bundler-audit check --update
      - run: gem build solidus_nexi.gemspec
      - run: ruby dev/verify_package.rb solidus_nexi-*.gem
      - run: bundle exec ruby dev/smoke_package.rb solidus_nexi-*.gem

  rspec:
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    name: Solidus ${{ matrix.solidus }}, Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - {solidus: "4.7", rails: "7.2", ruby: "3.2"}
          - {solidus: "4.7", rails: "7.2", ruby: "3.3"}
          - {solidus: "4.7", rails: "7.2", ruby: "4.0"}
          - {solidus: "4.7", rails: "8.0", ruby: "3.3"}
          - {solidus: "4.7", rails: "8.1", ruby: "3.3"}
          - {solidus: "4.7", rails: "8.1", ruby: "4.0"}
          - {solidus: "4.8", rails: "8.1", ruby: "3.3"}
          - {solidus: "4.8", rails: "8.1", ruby: "4.0"}
          - {solidus: "4.6", rails: "7.2", ruby: "3.2"}
          - {solidus: "4.6", rails: "7.2", ruby: "3.3"}
    env:
      SOLIDUS_VERSION: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Verify dependency matrix
        run: |
          bundle exec ruby -rsolidus_core -e '
            solidus = Gem::Version.new(Spree.solidus_version).segments.first(2).join(".")
            abort "Unexpected Solidus #{solidus}" unless solidus == ENV.fetch("SOLIDUS_VERSION")
            expected = ENV.fetch("RAILS_VERSION")
            actual = Gem::Version.new(Rails::VERSION::STRING).segments.first(2).join(".")
            abort "Expected Rails #{expected}, resolved #{Rails::VERSION::STRING}" unless actual == expected
          '
      - name: Build test application
        run: bundle exec rake extension:test_app
      - name: Check eager loading
        run: bin/zeitwerk-check
      - name: Run test suite
        run: bundle exec rake

  mysql:
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    name: MySQL 8.4
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: solidus_nexi_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=mysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB: mysql
      DB_HOST: 127.0.0.1
      DB_USERNAME: root
      DB_PASSWORD: mysql
      SOLIDUS_VERSION: "4.8"
      RAILS_VERSION: "8.1"
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build MySQL test application
        run: bundle exec rake extension:test_app
      - name: Run test suite
        run: bundle exec rake
