name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 4"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rspec:
    name: Solidus ${{ matrix.solidus }}, Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {solidus: v4.7, rails: "7.2", ruby: "3.2"}
          - {solidus: v4.7, rails: "7.2", ruby: "3.3"}
          - {solidus: v4.7, rails: "7.2", ruby: "3.4"}
          - {solidus: v4.7, rails: "7.2", ruby: "4.0"}
          - {solidus: v4.6, rails: "7.1", ruby: "3.2"}
          - {solidus: v4.6, rails: "7.2", ruby: "3.3"}
    env:
      SOLIDUS_BRANCH: ${{ matrix.solidus }}
      RAILS_VERSION: ${{ matrix.rails }}
      SOLIDUS_PREFERENCES_MASTER_KEY: 0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake extension:test_app
      - run: bundle exec rake

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rubocop

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: gem build solidus_nexi.gemspec
